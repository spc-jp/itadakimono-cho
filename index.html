  <style>
    :root{color-scheme:light;--ink:#503642;--muted:#866e7a;--dark:#8e4c69;--rose:#b16c89;--rose-light:#f8dfe9;--line:#efdde5;--cream:#fffafc;--gold:#b48c57;--green:#527963;--shadow:0 8px 30px rgba(114,65,86,.085)}
    *{box-sizing:border-box}html{background:#fbf3f6}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);font-size:16px;-webkit-font-smoothing:antialiased;background:radial-gradient(circle at 15% 5%,#fff 0,#fff0 35%),linear-gradient(145deg,#fff7fa,#f7e4ed 60%,#fcebf2);min-height:100dvh}
    button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b56f90;outline-offset:2px}svg{display:block}
    .phone{max-width:510px;margin:auto;min-height:100dvh;background:#fffbfc;position:relative;box-shadow:0 16px 80px rgba(95,49,68,.12)}

    .hero:before{content:"";position:absolute;right:-30px;bottom:-95px;width:235px;height:235px;border:1px solid rgba(255,255,255,.45);border-radius:50%;box-shadow:0 0 0 23px rgba(255,255,255,.12),0 0 0 56px rgba(255,255,255,.09)}
    .hero:after{content:"✦";position:absolute;top:46px;right:30px;font-size:36px;color:#fff9ec;opacity:.8;text-shadow:0 3px 15px rgba(111,64,80,.2)}
    .brand{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
    .brand-icon{width:47px;height:47px;border-radius:17px;background:linear-gradient(145deg,#fffbf2,#f2d4bd);display:grid;place-items:center;color:#ad7c4a;border:1px solid #fbece1;box-shadow:0 5px 16px rgba(127,83,67,.13)}
    .brand p{margin:0;font-size:11px;letter-spacing:.22em;color:#a47888;font-weight:700}.brand strong{display:block;font-size:24px;letter-spacing:.07em;color:#6f4559;margin-top:2px;font-weight:760}
    .hero-message{position:relative;z-index:1;margin:34px 0 0}.hero-message p{margin:0 0 6px;font-size:13px;color:#7f5264;font-weight:650}.hero-message h1{font-size:26px;line-height:1.55;letter-spacing:.035em;margin:0;font-weight:760;color:#663b4f}.hero-message small{display:block;margin-top:9px;font-size:13px;color:#764b5e}
    .page{padding:20px 20px 115px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:-42px;position:relative;z-index:2;margin-bottom:22px}
    .stat{border-radius:20px;padding:17px 17px 15px;background:rgba(255,255,255,.96);box-shadow:0 10px 27px rgba(115,62,84,.11);border:1px solid #f4dfe8}.stat small{display:block;font-size:12px;color:var(--muted);font-weight:700}.stat b{font-size:31px;line-height:1.35;color:#8e4e68}.stat em{font-size:12px;font-style:normal;color:#947883;margin-left:2px}
    .cta{display:flex;width:100%;min-height:69px;align-items:center;justify-content:center;gap:10px;background:linear-gradient(115deg,#91516e 0%,#b16c8c 55%,#d79cb3 100%);border:0;border-radius:20px;color:white;font-weight:760;font-size:18px;letter-spacing:.02em;box-shadow:0 12px 22px rgba(161,86,119,.24);padding:14px 16px}.cta svg{width:24px;height:24px}.cta:active{transform:translateY(1px)}
    .intro{margin:9px 0 22px;text-align:center;color:#947b86;font-size:12px}.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}.shortcut{min-height:102px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;justify-content:center;background:linear-gradient(160deg,#fff,#fff8fb);border:1px solid #f1dfe7;border-radius:20px;padding:17px;box-shadow:var(--shadow);text-align:left;color:#705162;font-weight:750}.shortcut .ic{display:grid;place-items:center;background:#f8e3ec;color:#ad6c87;width:34px;height:34px;border-radius:11px}.shortcut .ic svg{width:20px;height:20px}
    .sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sectionhead h2{margin:0;font-size:17px;color:#653e50;letter-spacing:.015em}.linkbutton{color:#a36680;border:0;background:transparent;font-size:13px;font-weight:750;padding:8px 4px}.records{display:grid;gap:11px}.record{display:flex;align-items:center;gap:13px;text-align:left;border:1px solid #f1dfe7;padding:15px 13px;background:#fff;border-radius:19px;width:100%;box-shadow:0 3px 14px rgba(107,59,83,.05);color:var(--ink)}.record-icon{flex:0 0 45px;width:45px;height:45px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(150deg,#fff1f6,#f4cfde);color:#b36e89}.record-icon svg{width:22px;height:22px}.record-main{min-width:0;flex:1}.record-main strong{display:block;font-size:16px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record-main small{display:block;color:#856f7a;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record-main time{display:block;font-size:12px;color:#9a838e;margin-top:5px}.pill{white-space:nowrap;border-radius:40px;padding:7px 9px;font-size:11px;font-weight:800;background:#fbead6;color:#94683c}.pill.done{background:#e9f1ec;color:#4e7961}
    .topbar{display:flex;gap:12px;align-items:center;padding:18px 20px 15px;background:linear-gradient(120deg,#fff5f9,#f4d9e4);border-radius:0 0 23px 23px}.topbar h1{margin:0;font-size:21px;color:#6b3f55;letter-spacing:.02em}.topbar p{font-size:12px;color:#977887;margin:4px 0 0}.back{height:45px;width:45px;flex-shrink:0;display:grid;place-items:center;border-radius:14px;background:#fff;border:1px solid #f1dce5;color:#91576e}.back svg{width:22px;height:22px}
    .field{display:grid;gap:8px;margin-bottom:22px}.field label{font-size:16px;font-weight:770;color:#634456}.field .hint{color:#947e87;font-size:12px;margin-top:-3px}.required{color:#bc6a83;font-size:12px;margin-left:7px}.field input:not([type=checkbox]):not([type=file]),.field textarea,.field select{min-height:56px;width:100%;border:1px solid #e6cbd6;border-radius:15px;background:#fff;color:#4c3942;padding:13px 15px;font-size:17px;outline:none}.field textarea{min-height:94px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#b86d91;box-shadow:0 0 0 3px #f8e1eb}.field input::placeholder,.field textarea::placeholder{color:#ac99a1}.field-date{background:#fff;padding:0;border-radius:15px}.extra{border:1px solid #efdce5;border-radius:17px;padding:14px;margin:3px 0 22px;background:#fff}.extra summary{font-weight:760;color:#7d5268;cursor:pointer;padding:5px}.extra .inner{padding-top:20px}
    .recent-wrap{margin-top:3px}.recent-title{font-size:12px;color:#8b7180;font-weight:750;margin-bottom:8px}.recent-options{display:flex;flex-wrap:wrap;gap:8px}.recent-name{min-height:45px;max-width:100%;border:1px solid #e6c8d6;border-radius:23px;padding:10px 15px;background:linear-gradient(145deg,#fff9fb,#f7e5ed);color:#784c61;font-size:15px;font-weight:760;overflow-wrap:anywhere;box-shadow:0 2px 8px rgba(127,71,99,.07)}.recent-name:active{background:#efcbda}
    .photo-select{min-height:104px;display:flex;align-items:center;justify-content:center;gap:12px;color:#9f6280;background:#fff8fb;border:2px dashed #ebcdd9;border-radius:18px;font-weight:730;padding:14px;text-align:center}.photo-select svg{width:25px;height:25px}.photo-preview{height:130px;max-width:100%;object-fit:cover;border-radius:12px;margin-top:10px}.actions{display:grid;gap:11px;margin-top:20px}.secondary{min-height:53px;border-radius:16px;background:#fff;border:1px solid #ebd4df;color:#89536c;font-weight:760;padding:12px 16px}.secondary{display:flex;align-items:center;justify-content:center;gap:8px}.secondary svg{width:20px;height:20px;flex-shrink:0}.danger{color:#9b4760}.tiny{font-size:12px;color:#967e89;line-height:1.7}.hide{display:none!important}
    .tabs{display:flex;gap:7px;overflow-x:auto;padding:1px 0 15px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;min-height:41px;border-radius:30px;padding:9px 16px;background:#fff;border:1px solid #ead8e0;color:#876a7a;font-size:14px;font-weight:750}.tab.active{color:#fff;border-color:#a96d87;background:#aa6c87}.search{display:flex;align-items:center;gap:8px;border:1px solid #efdce5;border-radius:15px;background:#fff;padding:0 14px;margin-bottom:16px;color:#b27d95}.search svg{width:20px;height:20px;flex-shrink:0}.search input{border:0;outline:0;min-width:0;width:100%;height:54px;background:transparent;font-size:16px;color:#56404b}.search input:focus{outline:0}.empty{text-align:center;padding:48px 20px;color:#977e88;line-height:1.8;background:#fff;border:1px dashed #edcfdb;border-radius:20px}.empty .flower{font-size:40px;display:block;margin-bottom:12px}
    .detailhead{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}.detailhead h2{font-size:23px;margin:0;color:#624152}.detail-photo{width:100%;max-height:245px;object-fit:cover;border-radius:18px;margin:0 0 19px}.info{background:#fff;border:1px solid #f0dfe6;border-radius:19px;padding:6px 16px;margin-bottom:17px}.info-row{display:flex;align-items:start;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid #f7edf1}.info-row:last-child{border:0}.info-row span{color:#947a87;font-size:14px}.info-row strong{font-size:15px;text-align:right;max-width:68%;overflow-wrap:anywhere}.checkrow{display:flex;align-items:center;gap:12px;background:#fff;padding:17px 14px;border:1px solid #efdee6;border-radius:17px;margin-bottom:11px;cursor:pointer;font-weight:770}.checkrow input{width:24px;height:24px;accent-color:#b36e8b}.checkrow small{display:block;color:#927d85;font-weight:450;margin-top:3px}
    .settings-block{background:#fff;border:1px solid #efdce5;border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:var(--shadow)}.settings-block h2{font-size:16px;margin:0 0 8px;color:#674356}.settings-block p{line-height:1.7;color:#86717b;font-size:13px;margin:0 0 13px}.settings-block .secondary{width:100%;margin-top:8px}
    .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:510px;display:grid;grid-template-columns:repeat(3,1fr);padding:9px 8px max(9px,env(safe-area-inset-bottom));background:rgba(255,251,253,.97);box-shadow:0 -7px 20px rgba(84,44,63,.075);border-top:1px solid #f1e4ea;z-index:40;backdrop-filter:blur(12px)}.navbtn{border:0;background:transparent;color:#9a7b8c;display:grid;place-items:center;gap:4px;font-size:11px;font-weight:800;min-height:55px}.navbtn svg{width:23px;height:23px}.navbtn.selected{color:#a45d7d}.navbtn.selected .nav-icon{background:#f7dfea;border-radius:13px}.nav-icon{padding:7px}
    .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:95px;z-index:100;padding:13px 19px;background:#65465a;color:#fff;box-shadow:0 8px 20px rgba(75,37,56,.24);border-radius:13px;opacity:0;pointer-events:none;transition:.22s;max-width:calc(100% - 40px);text-align:center;font-size:14px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .eyebrow{color:#b07b94;font-size:12px;letter-spacing:.12em;font-weight:800;margin:8px 0 4px}.title-area{margin:0 0 20px}.title-area h2{font-size:21px;margin:0 0 5px}.title-area p{color:#927a85;font-size:13px;margin:0}
    @media(min-width:600px){body{padding:28px 0}.phone{min-height:calc(100dvh - 56px);border-radius:34px;overflow:hidden;border:1px solid #f1dbe5}.bottom{bottom:0;border-radius:0 0 22px 22px}.hero{padding-top:39px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<div id="app" class="phone"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hide" aria-label="バックアップファイルを選択">
<script>
(()=>{'use strict';
const STORAGE='itadakimono_rose_v1';
const DB_NAME='itadakimono-cho', DB_STORE='app';
let database=null, storageMode='indexeddb';
function openDatabase(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return}const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('DB open error'));r.onblocked=()=>reject(new Error('DB blocked'))})}
function dbGet(){return new Promise((resolve,reject)=>{const t=database.transaction(DB_STORE,'readonly'),r=t.objectStore(DB_STORE).get('records');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('DB read error'))})}
function dbPut(value){return new Promise((resolve,reject)=>{const t=database.transaction(DB_STORE,'readwrite');t.objectStore(DB_STORE).put(value,'records');t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error||new Error('DB write error'));t.onabort=()=>reject(t.error||new Error('DB transaction aborted'))})}
async function loadRecords(){try{database=await openDatabase();let existing=await dbGet();if(Array.isArray(existing))return existing;let old=null;try{old=JSON.parse(localStorage.getItem(STORAGE))}catch(e){}let initial=Array.isArray(old)?old:[];await dbPut(initial);return initial}catch(e){storageMode='localStorage';try{const old=JSON.parse(localStorage.getItem(STORAGE));return Array.isArray(old)?old:[]}catch(err){return []}}}
const ICON={gift:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8H8a2.5 2.5 0 0 1 0-5c3.5 0 4 5 4 5Zm0 0h4a2.5 2.5 0 0 0 0-5c-3.5 0-4 5-4 5Z"/>',home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.7 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.7 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="m15 18-6-6 6-6"/>',camera:'<path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/>',search:'<circle cx="10.8" cy="10.8" r="7.8"/><path d="m17 17 5 5"/>',edit:'<path d="m15 5 4 4M4 20l4.3-.8L20 7.5a2.8 2.8 0 0 0-4-4L4.3 15.2 4 20Z"/>',check:'<path d="m5 12 4 4L19 6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/>',upload:'<path d="M12 21V9m-5 5 5-5 5 5M4 7V4h16v3"/>',trash:'<path d="M4 7h16M9 7V4h6v3m3 0-.7 13H6.7L6 7M10 11v6m4-6v6"/>',flower:'<path d="M12 12c-2-2-5-4-5-7a3 3 0 0 1 5-1 3 3 0 0 1 5 1c0 3-3 5-5 7Zm0 0c2-2 5-4 8-3a3 3 0 0 1 1 5 3 3 0 0 1-2 5c-3 0-5-5-7-7Zm0 0c2 2 4 5 3 8a3 3 0 0 1-5 1 3 3 0 0 1-5-2c0-3 5-5 7-7Zm0 0c-2 2-5 4-8 3a3 3 0 0 1-1-5 3 3 0 0 1 2-5c3 0 5 5 7 7Z"/>',settings:'<path d="M4 5h16v14H4zM8 9h8m-8 4h8"/>',arrow:'<path d="m9 18 6-6-6-6"/>'};
function icon(n){return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICON[n]||ICON.gift)+'</svg>'}
const $=id=>document.getElementById(id);const app=$('app');
const safe=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const readable=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return safe(d||'');let [y,m,day]=d.split('-');return `${+y}年${+m}月${+day}日`};
let records=[],page='home',filter='all',query='',openId=null,editId=null,photoBuffer='';
async function persist(){try{if(storageMode==='indexeddb')await dbPut(records);else localStorage.setItem(STORAGE,JSON.stringify(records));return true}catch(e){toast('保存できませんでした。スマホの空き容量をご確認ください');return false}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2800)}
function buttonNav(current){return `<nav class="bottom" aria-label="メニュー">${[['home','ホーム','home'],['list','記録一覧','list'],['thanks','お礼の確認','heart']].map(([p,name,i])=>`<button class="navbtn ${current===p?'selected':''}" data-go="${p}" aria-label="${name}"><span class="nav-icon">${icon(i)}</span>${name}</button>`).join('')}</nav>`}
function header(title,sub){return `<header class="topbar"><button class="back" data-go="home" aria-label="ホームへ戻る">${icon('back')}</button><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div></header>`}
function card(r){return `<button class="record" data-open="${safe(r.id)}"><span class="record-icon">${icon('gift')}</span><span class="record-main"><strong>${safe(r.who)}</strong><small>${safe(r.what)}</small><time>${readable(r.date)}</time></span><span class="pill ${r.thanked?'done':''}">${r.thanked?'お礼済み':'お礼まだ'}</span></button>`}
function sorted(arr){return [...arr].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.id).localeCompare(String(a.id)))}
// 保存した記録から、最近入力した人を5名まで重複なしで表示します。
// 過去の記録にも対応するよう、更新日時が無い場合は保存順で判断します。
function recentSenders(){const seen=new Set();return records.map((r,i)=>({name:String(r.who||'').trim(),at:Number(r.lastUsedAt)||0,i})).sort((a,b)=>b.at-a.at||a.i-b.i).filter(({name})=>{const key=name.replace(/\s+/g,' ').toLocaleLowerCase();if(!name||seen.has(key))return false;seen.add(key);return true}).slice(0,5).map(x=>x.name)}
function home(){let month=today().slice(0,7),count=records.filter(r=>r.date.slice(0,7)===month).length,pending=records.filter(r=>!r.thanked).length;return `<header class="hero"><div class="brand"><span class="brand-icon">${icon('gift')}</span><div><p>GIFT JOURNAL</p><strong>いただきもの帳</strong></div></div><div class="hero-message"><p>日々の感謝を、やさしく記録</p><h1>いただいた気持ちを、<br>大切な思い出に。</h1><small>あなたの「ありがとう」を、忘れずに。</small></div></header><main class="page"><div class="stats"><div class="stat"><small>今月のいただきもの</small><b>${count}</b><em>件</em></div><div class="stat"><small>お礼がまだ</small><b>${pending}</b><em>件</em></div></div><button class="cta" data-go="new">${icon('plus')}いただきものを記録</button><p class="intro">「誰から」「何を」だけで記録できます</p><div class="shortcuts"><button class="shortcut" data-go="list"><span class="ic">${icon('list')}</span>過去の記録を見る</button><button class="shortcut" data-go="thanks"><span class="ic">${icon('heart')}</span>お礼・お返しを確認</button></div><div class="sectionhead"><h2>最近のいただきもの</h2><button class="linkbutton" data-go="list">すべて見る ›</button></div><div class="records">${sorted(records).slice(0,4).map(card).join('')||`<div class="empty"><span class="flower">✿</span>まだ記録がありません。<br>まずは1件、記録してみましょう。</div>`}</div><button class="linkbutton" data-go="settings" style="margin-top:20px">⚙ バックアップ・設定</button></main>${buttonNav('home')}`}
function list(){let matched=sorted(records).filter(r=>(filter!=='pending'||!r.thanked)&&(filter!=='done'||r.thanked)&&(!query||(r.who+' '+r.what+' '+r.category).toLowerCase().includes(query.toLowerCase())));return `${header('記録一覧','名前や品物で、すぐ探せます')}<main class="page"><div class="search">${icon('search')}<input id="searchInput" aria-label="名前や品物を検索" value="${safe(query)}" placeholder="名前や品物で探す" autocomplete="off"></div><div class="tabs">${[['all','すべて'],['pending','お礼まだ'],['done','お礼済み']].map(([v,t])=>`<button class="tab ${filter===v?'active':''}" data-filter="${v}">${t}</button>`).join('')}</div><div id="listRecords" class="records">${matched.length?matched.map(card).join(''):`<div class="empty"><span class="flower">✿</span>該当する記録はありません。</div>`}</div><div style="height:18px"></div><button class="cta" data-go="new">${icon('plus')}新しく記録する</button></main>${buttonNav('list')}`}
function thanks(){let pending=sorted(records.filter(r=>!r.thanked));let returns=sorted(records.filter(r=>r.thanked&&!r.returned));return `${header('お礼・お返しの確認','気持ちを伝え忘れないために')}<main class="page"><div class="title-area"><p class="eyebrow">THANK YOU</p><h2>お礼がまだの方 <span style="color:#b17590">${pending.length}件</span></h2><p>お礼を伝えたら、記録をタップしてチェック。</p></div><div class="records">${pending.length?pending.map(card).join(''):'<div class="empty">すべてお礼済みです。<br>ありがとうございます ♡</div>'}</div><div class="title-area" style="margin-top:34px"><h2>お返しのチェック <span style="color:#b17590">${returns.length}件</span></h2><p>お返しが必要な場合に、確認してください。</p></div><div class="records">${returns.length?returns.map(card).join(''):'<div class="empty">表示する記録はありません。</div>'}</div><p class="tiny" style="margin-top:15px">※ お返しが必要かどうかは、ご家庭でご判断ください。未チェックの記録が表示されます。</p></main>${buttonNav('thanks')}`}
const categories=['選択しない','お中元','お歳暮','お土産','お祝い','誕生日','季節のご挨拶','その他'];
function form(){const r=editId?records.find(x=>x.id===editId):null;const v=r||{who:'',what:'',date:today(),category:'選択しない',note:'',photo:'',thanked:false,returned:false};photoBuffer=v.photo||'';const recent=recentSenders();return `${header(editId?'記録を編集':'新しいいただきもの','ゆっくり入力して大丈夫です')}<main class="page"><p class="tiny" style="margin:0 0 23px">「誰から」「何を」の2つで記録できます。<br>日付は自動的に今日になります。</p><form id="giftForm"><div class="field"><label for="who">① どなたから？<span class="required">必須</span></label><input id="who" name="who" type="text" placeholder="例：田中さん" maxlength="80" value="${safe(v.who)}" required autocomplete="off">${recent.length?`<div class="recent-wrap"><div class="recent-title">最近入力した方（タップで選べます）</div><div class="recent-options">${recent.map(name=>`<button type="button" class="recent-name" data-recent-sender="${safe(name)}">${safe(name)}</button>`).join('')}</div></div>`:''}</div><div class="field"><label for="what">② 何をいただきましたか？<span class="required">必須</span></label><input id="what" name="what" type="text" placeholder="例：お菓子の詰め合わせ" maxlength="120" value="${safe(v.what)}" required></div><div class="field"><label for="date">③ いついただきましたか？</label><input id="date" name="date" type="date" value="${safe(v.date)}" required></div><details class="extra" ${r&&(r.photo||r.note||r.category!=='選択しない')?'open':''}><summary>＋ 写真・種類・メモを追加（任意）</summary><div class="inner"><div class="field"><label for="category">いただきものの種類</label><select id="category" name="category">${categories.map(c=>`<option value="${safe(c)}" ${c===v.category?'selected':''}>${safe(c)}</option>`).join('')}</select></div><div class="field"><label for="photo">品物の写真</label><label class="photo-select" for="photo">${icon('camera')} 写真を選ぶ・撮る</label><input id="photo" name="photo" type="file" accept="image/*" style="font-size:13px;max-width:100%"><img id="photoPreview" class="photo-preview ${photoBuffer?'':'hide'}" src="${safe(photoBuffer)}" alt="選択した品物の写真"><button id="removePhoto" class="linkbutton ${photoBuffer?'':'hide'}" type="button">写真を外す</button><span class="hint">※ 写真は小さくして保存します</span></div><div class="field"><label for="note">メモ</label><textarea id="note" name="note" placeholder="例：お礼は電話で伝える予定" maxlength="500">${safe(v.note)}</textarea></div></div></details><button class="cta" type="submit">${icon('check')}${editId?'変更を保存する':'この内容で記録する'}</button><div class="actions"><button class="secondary" type="button" data-go="${editId?'detail':'home'}">戻る</button></div></form></main>${buttonNav('home')}`}
function detail(){const r=records.find(x=>x.id===openId);if(!r){page='home';return home()}return `${header('いただきものの記録','内容の確認とお礼の管理')}<main class="page"><div class="detailhead"><p class="eyebrow">GIFT RECORD</p><h2>${safe(r.who)} </h2><div class="tiny">${readable(r.date)}</div></div>${r.photo?`<img class="detail-photo" src="${safe(r.photo)}" alt="いただきものの写真">`:''}<div class="info"><div class="info-row"><span>いただいたもの</span><strong>${safe(r.what)}</strong></div><div class="info-row"><span>いただいた日</span><strong>${readable(r.date)}</strong></div>${r.category&&r.category!=='選択しない'?`<div class="info-row"><span>種類</span><strong>${safe(r.category)}</strong></div>`:''}${r.note?`<div class="info-row"><span>メモ</span><strong style="white-space:pre-wrap">${safe(r.note)}</strong></div>`:''}</div><label class="checkrow"><input type="checkbox" data-toggle="thanked" ${r.thanked?'checked':''}><span>お礼を伝えました<small>電話やお手紙などで、お礼を伝えたらチェック</small></span></label><label class="checkrow"><input type="checkbox" data-toggle="returned" ${r.returned?'checked':''}><span>お返しをしました<small>お返しをしたときだけチェック</small></span></label><div class="actions"><button class="cta" data-go="edit">${icon('edit')}この記録を編集する</button><button class="secondary danger" id="deleteRecord">この記録を削除する</button></div></main>${buttonNav('list')}`}
function settings(){return `${header('設定・バックアップ','大切な記録を守るために')}<main class="page"><div class="settings-block"><h2>記録のバックアップ</h2><p>現在の記録（写真を含む）を1つのファイルに保存できます。万が一に備えて月1回程度保存してください。</p><button class="secondary" id="export">${icon('download')} <span>バックアップを保存する</span></button><button class="secondary" id="import">${icon('upload')} <span>バックアップを読み込む</span></button></div><div class="settings-block"><h2>記録の保存について</h2><p>頂き物の記録は、いま使っているスマホ内に保存され、GitHubには送信されません。別のブラウザやスマホとは自動共有されません。スマホの故障・アプリの削除・ブラウザデータの削除などで記録が消える可能性があります。月に1回程度、バックアップを「ファイル」やクラウドストレージへ保存してください。</p><button class="secondary danger" id="deleteAll">すべての記録を削除する</button></div><p class="tiny" style="text-align:center">いただきもの帳<br>やさしいローズピンクデザイン ♡</p></main>${buttonNav('home')}`}
function render(){app.innerHTML=({home,list,thanks,new:form,edit:form,detail,settings}[page]||home)();wire();window.scrollTo(0,0)}
function goto(p){if(p==='new'){editId=null}if(p==='edit'){editId=openId}if(p==='detail'&&!openId){p='home'}page=p;render()}
function wire(){app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>goto(b.dataset.go)));app.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{openId=b.dataset.open;goto('detail')}));app.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));
const si=$('searchInput');if(si){si.addEventListener('input',e=>{query=e.target.value;const found=sorted(records).filter(r=>(filter!=='pending'||!r.thanked)&&(filter!=='done'||r.thanked)&&(!query||(r.who+' '+r.what+' '+r.category).toLowerCase().includes(query.toLowerCase())));$('listRecords').innerHTML=found.length?found.map(card).join(''):'<div class="empty">該当する記録はありません。</div>';$('listRecords').querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{openId=b.dataset.open;goto('detail')}))})}
const gf=$('giftForm');if(gf){gf.querySelectorAll('[data-recent-sender]').forEach(b=>b.addEventListener('click',()=>{const whoInput=$('who');whoInput.value=b.dataset.recentSender;$('what').focus()}));gf.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(gf),who=String(fd.get('who')||'').trim(),what=String(fd.get('what')||'').trim(),date=String(fd.get('date')||'');if(!who||!what||!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('お名前・品物・日付をご確認ください');return}const old=editId?records.find(r=>r.id===editId):null;const obj={id:old?.id||'gift_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),who,what,date,category:String(fd.get('category')||'選択しない'),note:String(fd.get('note')||'').trim(),photo:photoBuffer,lastUsedAt:Date.now(),thanked:old?.thanked||false,returned:old?.returned||false};const before=records;if(old)records=records.map(r=>r.id===old.id?obj:r);else records=[obj,...records];if(!await persist()){records=before;return}openId=obj.id;editId=null;goto('detail');toast('記録を保存しました ♡')});const pf=$('photo');pf?.addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('画像ファイルを選んでください');return}if(f.size>20*1024*1024){toast('写真が大きすぎます。別の写真をお試しください');return}const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{let k=Math.min(1,900/im.width,900/im.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*k));canvas.height=Math.max(1,Math.round(im.height*k));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);photoBuffer=canvas.toDataURL('image/jpeg',.72);$('photoPreview').src=photoBuffer;$('photoPreview').classList.remove('hide');$('removePhoto').classList.remove('hide');toast('写真を追加しました')};im.onerror=()=>toast('写真を読み込めませんでした');im.src=reader.result};reader.readAsDataURL(f)});$('removePhoto')?.addEventListener('click',()=>{photoBuffer='';$('photoPreview').src='';$('photoPreview').classList.add('hide');$('removePhoto').classList.add('hide');if($('photo'))$('photo').value=''})}
app.querySelectorAll('[data-toggle]').forEach(i=>i.addEventListener('change',async ()=>{let r=records.find(r=>r.id===openId);if(!r)return;let old=r[i.dataset.toggle];r[i.dataset.toggle]=i.checked;if(!await persist()){r[i.dataset.toggle]=old;render();return}toast('変更しました ♡')}));
$('deleteRecord')?.addEventListener('click',async ()=>{const r=records.find(x=>x.id===openId);if(r&&confirm('「'+r.who+'」の記録を削除しますか？')){const old=records;records=records.filter(x=>x.id!==openId);if(!await persist()){records=old;return}goto('list');toast('削除しました')}});
$('export')?.addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'itadakimono-rose',version:1,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='いただきもの帳_バックアップ_'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('バックアップを作成しました。保存先をご確認ください')});
$('import')?.addEventListener('click',()=>{$('importFile').click()});

$('deleteAll')?.addEventListener('click',async ()=>{if(confirm('すべての記録を削除します。バックアップを保存しましたか？')&&confirm('本当にすべて削除しますか？元には戻せません。')){const before=records;records=[];if(!await persist()){records=before;return}goto('home');toast('すべて削除しました')}})}
$('importFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>60*1024*1024){toast('ファイルが大きすぎます');e.target.value='';return}const reader=new FileReader();reader.onload=async ()=>{try{const data=JSON.parse(reader.result);if(data.app!=='itadakimono-rose'||!Array.isArray(data.records)||data.records.length>10000)throw Error('invalid');const clean=data.records.map((r,i)=>({id:'import_'+Date.now()+'_'+i,who:String(r.who||'').slice(0,80),what:String(r.what||'').slice(0,120),date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:today(),category:String(r.category||'選択しない').slice(0,40),note:String(r.note||'').slice(0,500),photo:typeof r.photo==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(r.photo)&&r.photo.length<3500000?r.photo:'',lastUsedAt:Number.isFinite(Number(r.lastUsedAt))&&Number(r.lastUsedAt)>0?Number(r.lastUsedAt):0,thanked:r.thanked===true,returned:r.returned===true,demo:false}));if(clean.some(r=>!r.who||!r.what))throw Error('invalid');if(!confirm('現在の記録をバックアップの'+clean.length+'件で置き換えます。よろしいですか？'))return;let old=records;records=clean;if(!await persist()){records=old;return}goto('home');toast('バックアップを読み込みました')}catch(err){toast('正しいバックアップファイルを選んでください')}};reader.readAsText(file);e.target.value=''});
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
(async()=>{records=await loadRecords();render();if(storageMode!=='indexeddb')toast('簡易保存モードで動作中です。こまめにバックアップしてください')})();
})();
</script>
</body></html>
